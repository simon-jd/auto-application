# Run explicitly with: auto-app ingest run --config config/feeds.yaml
# Source names are persistent identities. Use separate names for distinct feeds.
# true leaves out rows whose own title or employment type says internship; a source may set its own value.
skip_internships: false
sources:
  simplify-newgrad:
    kind: repository
    location: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
  simplify-internships:
    kind: repository
    location: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
    # The upstream feed also contains other terms/years; all are preserved.
  speedyapply-swe-internships:
    kind: repository
    format: speedyapply
    location: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md
  speedyapply-swe-newgrad:
    kind: repository
    format: speedyapply
    location: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/NEW_GRAD_USA.md
  speedyapply-ai-internships:
    kind: repository
    format: speedyapply
    location: https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/README.md
  speedyapply-ai-newgrad:
    kind: repository
    format: speedyapply
    location: https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/NEW_GRAD_USA.md
  applyguy-newgrad:
    kind: repository
    format: applyguy
    location: https://raw.githubusercontent.com/ApplyGuy/2027-New-Grad-Jobs/main/data/new-grad-jobs.json
  ricsign-early-career:
    kind: repository
    format: ricsign
    location: https://raw.githubusercontent.com/ricsign/Ricsign-New-Grads-Jobs-2027/main/data/v1/jobs.json
  jobright-swe-newgrad:
    kind: repository
    format: jobright
    location: https://raw.githubusercontent.com/jobright-ai/2026-Software-Engineer-New-Grad/master/README.md
  jobright-swe-internships:
    kind: repository
    format: jobright
    location: https://raw.githubusercontent.com/jobright-ai/2026-Software-Engineer-Internship/master/README.md

  # Employer board examples are disabled. Replace the board slug and company
  # only after reviewing `auto-app worker boards --yaml` and the public API.
  board-greenhouse-example:
    enabled: false
    kind: repository
    format: greenhouse-board
    company: Example Employer
    location: https://boards-api.greenhouse.io/v1/boards/example/jobs?content=true
  board-lever-example:
    enabled: false
    kind: repository
    format: lever-board
    company: Example Employer
    location: https://api.lever.co/v0/postings/example?mode=json
  board-ashby-example:
    enabled: false
    kind: repository
    format: ashby-board
    company: Example Employer
    location: https://api.ashbyhq.com/posting-api/job-board/example?includeCompensation=true
  # Workday career sites: the careers URL and a required company. Facets use the site's own
  # labels or parameters and values; search runs one Workday search per text. Keep the total
  # within a few hundred postings (Workday lists at most 2000; pages of 20, one second apart).
  board-workday-example:
    enabled: false
    kind: repository
    format: workday-board
    company: Example Employer
    location: https://example.wd5.myworkdayjobs.com/External
    # search: [embedded, firmware]
    facets:
      Country: [United States of America]
    max_pages: 25

  # Eightfold career sites (Qualcomm …): the tenant's careers URL with its domain; company is required.
  # country is Eightfold's location text; filters name Eightfold's own filters (sent as filter_<name>).
  # Pages of 10, two seconds apart; JDs come through the worker's enrichment.
  board-eightfold-example:
    enabled: false
    kind: repository
    format: eightfold-board
    company: Example Employer
    location: https://example.eightfold.ai/careers?domain=example.com
    country: United States
    # filters:
    #   job_family: [software engineering]
    max_pages: 30

  # iCIMS career sites on the Jibe front end (careers.<company>.com/api/jobs): the list carries full JDs.
  # country is the site's country name; search runs one keyword search per text. Pages of 100.
  board-jibe-example:
    enabled: false
    kind: repository
    format: icims-jibe-board
    company: Example Employer
    location: https://careers.example.com
    country: United States

  # Oracle Recruiting Cloud (Candidate Experience) sites: company is required; country names one of the
  # site's location facets (one extra request resolves it). Pages of 100; JDs through enrichment.
  board-oracle-example:
    enabled: false
    kind: repository
    format: oracle-board
    company: Example Employer
    location: https://example.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1
    country: United States

  # SmartRecruiters companies: the careers page; country is an ISO code. Pages of 100; JDs through enrichment.
  board-smartrecruiters-example:
    enabled: false
    kind: repository
    format: smartrecruiters-board
    company: Example Employer
    location: https://careers.smartrecruiters.com/ExampleEmployer
    country: us

  recommendation-mail:
    enabled: false
    kind: email
    # Relative to this config file. Export chosen job recommendation emails here.
    paths:
      - ../data/mail/*.eml

  gmail-jobs:
    enabled: false  # authorize first, then enable in your config/feeds.yaml
    kind: mailbox
    provider: gmail
    purpose: jobs  # default; recommendation links become jobs
    credentials: ../credentials/gmail.json
    # Adjust sender domains to the recommendations you actually receive.
    # Alternatively: query: 'label:Jobs'
    query: '{from:linkedin.com from:jobright.ai from:simplify.jobs}'
    lookback_days: 14
    page_size: 50
    max_pages: 4

  # Personal Gmail IMAP. Supply real From addresses or a reviewed gmail_raw
  # scope, and create a private mode-600 credentials file before enabling.
  imap-jobs:
    enabled: false
    kind: mailbox
    provider: imap
    purpose: jobs
    credentials: ../credentials/imap.json
    folder: INBOX
    senders:
      - REPLACE_WITH_LINKEDIN_FROM_ADDRESS
      - REPLACE_WITH_JOBRIGHT_FROM_ADDRESS
    # gmail_raw: 'label:Jobs'
    lookback_days: 14
    page_size: 50
    max_pages: 4

  outlook-jobs:
    enabled: false
    kind: mailbox
    provider: outlook
    purpose: jobs
    credentials: ../credentials/outlook.json
    folder: inbox  # a well-known Graph folder name or folder ID
    # Replace with actual From addresses (not domains); or select a dedicated folder ID.
    senders: [recommendations@example.com]
    lookback_days: 14
    page_size: 50
    max_pages: 4

  # Application receipts / OA / interviews / rejections / offers.
  # Deliberately disabled; review scope and credentials before enabling.
  # See docs/application-tracking.md. Status mail never creates job leads.
  application-mail:
    enabled: false
    kind: mailbox
    provider: imap
    purpose: updates
    credentials: ../credentials/imap.json
    folder: INBOX
    senders: [recruiting@example.com]  # replace with reviewed actual From addresses
    lookback_days: 14
    page_size: 50
    max_pages: 4
