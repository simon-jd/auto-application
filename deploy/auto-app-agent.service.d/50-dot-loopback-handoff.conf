# Dot's private handoff (option C, live since 2026-11-17): the stock auto-app-agent.service plus
# --handoff-tools --allow-unauthenticated-loopback-handoff on 127.0.0.1:8767, without MCP authentication.
# Install as ~/.config/systemd/user/auto-app-agent.service.d/50-dot-loopback-handoff.conf (docs/dot-setup.md).
# It replaces the whole ExecStart: when the stock unit's ExecStart changes, make the same change here.
# Roll back: remove the installed file, daemon-reload, restart auto-app-agent.service.
[Service]
ExecStart=
ExecStart=%h/Desktop/job-search/auto-application/.venv/bin/auto-app-agent serve --db %h/Desktop/job-search/runtime/data/auto_app.db --preferences %h/Desktop/job-search/runtime/config/preferences.json --preparation-dir %h/Desktop/job-search/runtime/preparation --transport streamable-http --host 127.0.0.1 --port 8767 --control-tools --handoff-tools --allow-unauthenticated-loopback-handoff
